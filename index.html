<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام إدارة الصيدليات - إدارة المخزون والمبيعات">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8FAFC">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مدير الصيدلية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدير الصيدلية</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary-color: #2196F3;
      --background-color: #F8FAFC;
      --surface-color: #FFFFFF;
      --text-color: #0F172A;
      --text-secondary: #475569;
      --error-color: #DC2626;
      --shadow-color: rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Naskh Arabic', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background-color);
      transition: opacity 0.35s ease;
    }

    #loading-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(100%, 400px);
      margin: 1rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--surface-color);
      border-radius: 16px;
      box-shadow: 0 12px 32px var(--shadow-color);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color), #1565C0);
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.25);
      font-size: 2rem;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: var(--text-color);
    }

    .app-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    .loading-spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 1rem;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .error-container {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(220, 38, 38, 0.25);
      background: rgba(220, 38, 38, 0.06);
      color: var(--error-color);
      text-align: center;
    }

    .error-container.is-visible {
      display: block;
    }

    .error-container p {
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .retry-button {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 40px;
      min-width: 88px;
    }

    .retry-button:hover,
    .retry-button:focus-visible {
      background: #1976D2;
      outline: 2px solid #90CAF9;
      outline-offset: 2px;
    }

    .loading-spinner.is-hidden {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen,
      .loading-spinner {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="logo" aria-hidden="true">💊</div>
      <h1 class="app-title">مدير الصيدلية</h1>
      <p class="app-subtitle">نظام احترافي لإدارة الأدوية والمبيعات</p>

      <div id="loading-spinner" class="loading-spinner" aria-hidden="true"></div>
      <p id="loading-text" class="loading-text">جاري تحميل التطبيق...</p>

      <div id="error-container" class="error-container" role="alert" aria-live="assertive">
        <p id="error-text">تعذر تحميل التطبيق. تحقق من الاتصال ثم أعد المحاولة.</p>
        <button type="button" class="retry-button" id="retry-button">إعادة المحاولة</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var loadingScreen = document.getElementById('loading-screen');
      var loadingText = document.getElementById('loading-text');
      var loadingSpinner = document.getElementById('loading-spinner');
      var errorContainer = document.getElementById('error-container');
      var errorText = document.getElementById('error-text');
      var retryButton = document.getElementById('retry-button');
      var isComplete = false;
      var hideTimer = null;

      function setLoadingMessage(message) {
        if (loadingText) {
          loadingText.textContent = message;
        }
      }

      function showError(message) {
        if (isComplete) {
          return;
        }
        if (loadingSpinner) {
          loadingSpinner.classList.add('is-hidden');
        }
        if (errorText && message) {
          errorText.textContent = message;
        }
        if (errorContainer) {
          errorContainer.classList.add('is-visible');
        }
        if (loadingScreen) {
          loadingScreen.setAttribute('aria-busy', 'false');
        }
      }

      function hideLoadingScreen() {
        if (isComplete || !loadingScreen) {
          return;
        }
        isComplete = true;
        loadingScreen.classList.add('is-hidden');
        loadingScreen.setAttribute('aria-busy', 'false');
        if (hideTimer) {
          clearTimeout(hideTimer);
        }
        hideTimer = setTimeout(function () {
          if (loadingScreen && loadingScreen.parentNode) {
            loadingScreen.parentNode.removeChild(loadingScreen);
          }
        }, 350);
      }

      function retryLoading() {
        window.location.reload();
      }

      if (retryButton) {
        retryButton.addEventListener('click', retryLoading);
      }

      window.__pharmacyLoader = {
        setLoadingMessage: setLoadingMessage,
        showError: showError,
        hideLoadingScreen: hideLoadingScreen,
        retryLoading: retryLoading
      };

      window.addEventListener('error', function (event) {
        if (event && event.target && event.target.tagName === 'SCRIPT') {
          var src = event.target.getAttribute('src') || '';
          if (src.indexOf('flutter_bootstrap.js') !== -1) {
            showError('تعذر تحميل ملف التشغيل. تحقق من الاتصال ثم أعد المحاولة.');
          }
        }
      }, true);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
