<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام إدارة الصيدليات - إدارة المخزون والمبيعات">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8FAFC">
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مدير الصيدلية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدير الصيدلية</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary-color: #2196F3;
      --background-color: #F8FAFC;
      --surface-color: #FFFFFF;
      --text-color: #0F172A;
      --text-secondary: #475569;
      --error-color: #DC2626;
      --shadow-color: rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Naskh Arabic', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background-color);
      transition: opacity 0.35s ease;
    }

    #loading-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .loading-card {
      width: min(100%, 400px);
      margin: 1rem;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--surface-color);
      border-radius: 16px;
      box-shadow: 0 12px 32px var(--shadow-color);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color), #1565C0);
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.25);
      font-size: 2rem;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: var(--text-color);
    }

    .app-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    .loading-spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 1rem;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loading-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .error-container {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid rgba(220, 38, 38, 0.25);
      background: rgba(220, 38, 38, 0.06);
      color: var(--error-color);
      text-align: center;
    }

    .error-container.is-visible {
      display: block;
    }

    .error-container p {
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .retry-button {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 40px;
      min-width: 88px;
    }

    .retry-button:hover,
    .retry-button:focus-visible {
      background: #1976D2;
      outline: 2px solid #90CAF9;
      outline-offset: 2px;
    }

    .loading-spinner.is-hidden {
      display: none;
    }

    /* Keep mobile_scanner HtmlElementView / camera video visible under Flutter canvas. */
    flt-platform-view,
    flt-platform-view-slot {
      width: 100%;
      height: 100%;
    }

    flt-platform-view video,
    video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      background: #000;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-screen,
      .loading-spinner {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="logo" aria-hidden="true">💊</div>
      <h1 class="app-title">مدير الصيدلية</h1>
      <p class="app-subtitle">نظام احترافي لإدارة الأدوية والمبيعات</p>

      <div id="loading-spinner" class="loading-spinner" aria-hidden="true"></div>
      <p id="loading-text" class="loading-text">جاري تحميل التطبيق...</p>

      <div id="error-container" class="error-container" role="alert" aria-live="assertive">
        <p id="error-text">تعذر تحميل التطبيق. تحقق من الاتصال ثم أعد المحاولة.</p>
        <button type="button" class="retry-button" id="retry-button">إعادة المحاولة</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var loadingScreen = document.getElementById('loading-screen');
      var loadingText = document.getElementById('loading-text');
      var loadingSpinner = document.getElementById('loading-spinner');
      var errorContainer = document.getElementById('error-container');
      var errorText = document.getElementById('error-text');
      var retryButton = document.getElementById('retry-button');
      var isComplete = false;
      var hideTimer = null;

      function setLoadingMessage(message) {
        if (loadingText) {
          loadingText.textContent = message;
        }
      }

      function showError(message) {
        if (isComplete) {
          return;
        }
        if (loadingSpinner) {
          loadingSpinner.classList.add('is-hidden');
        }
        if (errorText && message) {
          errorText.textContent = message;
        }
        if (errorContainer) {
          errorContainer.classList.add('is-visible');
        }
        if (loadingScreen) {
          loadingScreen.setAttribute('aria-busy', 'false');
        }
      }

      function hideLoadingScreen() {
        if (isComplete || !loadingScreen) {
          return;
        }
        isComplete = true;
        loadingScreen.classList.add('is-hidden');
        loadingScreen.style.display = 'none';
        loadingScreen.setAttribute('aria-busy', 'false');
        if (hideTimer) {
          clearTimeout(hideTimer);
        }
        hideTimer = setTimeout(function () {
          if (loadingScreen && loadingScreen.parentNode) {
            loadingScreen.parentNode.removeChild(loadingScreen);
          }
        }, 350);
      }

      function retryLoading() {
        window.location.reload();
      }

      if (retryButton) {
        retryButton.addEventListener('click', retryLoading);
      }

      window.__pharmacyLoader = {
        setLoadingMessage: setLoadingMessage,
        showError: showError,
        hideLoadingScreen: hideLoadingScreen,
        retryLoading: retryLoading
      };

      window.addEventListener('error', function (event) {
        if (event && event.target && event.target.tagName === 'SCRIPT') {
          var src = event.target.getAttribute('src') || '';
          if (src.indexOf('flutter_bootstrap.js') !== -1) {
            showError('تعذر تحميل ملف التشغيل. تحقق من الاتصال ثم أعد المحاولة.');
          }
        }
      }, true);
    })();
  </script>

  <script>
    (function () {
      function fixCanvasContainers() {
        var glassPane = document.querySelector('flt-glass-pane');
        if (!glassPane || !glassPane.shadowRoot) {
          return;
        }
        glassPane.shadowRoot.querySelectorAll('flt-canvas-container').forEach(function (container) {
          if (container.style.position !== 'absolute') {
            container.style.position = 'absolute';
          }
        });
      }

      var observer = new MutationObserver(fixCanvasContainers);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      fixCanvasContainers();
    })();
  </script>

  <!--
    Camera barcode overlay outside Flutter's canvas.
    HtmlElementView previews are often covered on Flutter 3.4x+; this mounts
    a real DOM layer above flt-glass-pane instead.
  -->
  <script>
    (function () {
      var OVERLAY_ID = 'pharmacy-barcode-overlay';
      var ZXING_SCRIPT_ID = 'pharmacy-zxing-library';
          var ZXING_SRC = 'https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js';
      var active = null;

      function stopStream(stream) {
        if (!stream) return;
        stream.getTracks().forEach(function (track) {
          try { track.stop(); } catch (_) {}
        });
      }

      function removeOverlay() {
        var existing = document.getElementById(OVERLAY_ID);
        if (existing && existing.parentNode) {
          existing.parentNode.removeChild(existing);
        }
      }

      function loadZxing() {
        if (window.ZXing && window.ZXing.BrowserMultiFormatReader) {
          return Promise.resolve(window.ZXing);
        }
        return new Promise(function (resolve, reject) {
          var existing = document.getElementById(ZXING_SCRIPT_ID);
          if (existing) {
            existing.addEventListener('load', function () { resolve(window.ZXing); });
            existing.addEventListener('error', function () {
              reject(new Error('تعذر تحميل مكتبة قراءة الباركود'));
            });
            return;
          }
          var script = document.createElement('script');
          script.id = ZXING_SCRIPT_ID;
          script.src = ZXING_SRC;
          script.async = true;
          script.onload = function () { resolve(window.ZXing); };
          script.onerror = function () {
            reject(new Error('تعذر تحميل مكتبة قراءة الباركود'));
          };
          document.head.appendChild(script);
        });
      }

      function closeInternal(result) {
        if (!active) return;
        var session = active;
        active = null;
        if (session.rafId) {
          cancelAnimationFrame(session.rafId);
        }
        if (session.codeReader && typeof session.codeReader.reset === 'function') {
          try { session.codeReader.reset(); } catch (_) {}
        }
        stopStream(session.stream);
        removeOverlay();
        if (typeof session.onDone === 'function') {
          session.onDone(result || '');
        }
      }

      function buildOverlay() {
        removeOverlay();
        var root = document.createElement('div');
        root.id = OVERLAY_ID;
        root.setAttribute('dir', 'rtl');
        root.style.cssText = [
          'position:fixed',
          'inset:0',
          'z-index:2147483000',
          'background:#000',
          'display:flex',
          'flex-direction:column',
          'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'
        ].join(';');

        var topBar = document.createElement('div');
        topBar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#fff;position:relative;z-index:2;';

        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.setAttribute('aria-label', 'إغلاق');
        closeBtn.textContent = '✕';
        closeBtn.style.cssText = 'background:rgba(255,255,255,0.15);border:0;color:#fff;width:44px;height:44px;border-radius:22px;font-size:20px;cursor:pointer;';
        closeBtn.addEventListener('click', function () { closeInternal(''); });

        var title = document.createElement('div');
        title.textContent = 'مسح الباركود';
        title.style.cssText = 'font-size:16px;font-weight:600;';

        topBar.appendChild(closeBtn);
        topBar.appendChild(title);
        topBar.appendChild(document.createElement('div'));

        var stage = document.createElement('div');
        stage.style.cssText = 'flex:1;position:relative;overflow:hidden;background:#000;';

        var video = document.createElement('video');
        video.setAttribute('playsinline', 'true');
        video.setAttribute('autoplay', 'true');
        video.muted = true;
        video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;';

        var guide = document.createElement('div');
        guide.style.cssText = [
          'position:absolute',
          'left:50%',
          'top:50%',
          'width:min(72vw,320px)',
          'height:min(40vw,180px)',
          'transform:translate(-50%,-50%)',
          'border:2px solid rgba(255,255,255,0.75)',
          'border-radius:12px',
          'box-shadow:0 0 0 9999px rgba(0,0,0,0.35)',
          'pointer-events:none'
        ].join(';');

        var hint = document.createElement('div');
        hint.textContent = 'وجّه الكاميرا نحو الباركود';
        hint.style.cssText = 'position:absolute;left:0;right:0;bottom:48px;text-align:center;color:rgba(255,255,255,0.9);font-size:16px;z-index:2;';

        var status = document.createElement('div');
        status.id = OVERLAY_ID + '-status';
        status.style.cssText = 'position:absolute;left:16px;right:16px;top:72px;text-align:center;color:#fff;font-size:14px;z-index:2;';
        status.textContent = 'جاري تشغيل الكاميرا...';

        stage.appendChild(video);
        stage.appendChild(guide);
        stage.appendChild(hint);
        stage.appendChild(status);
        root.appendChild(topBar);
        root.appendChild(stage);
        document.body.appendChild(root);

        return { root: root, video: video, status: status };
      }

      function setStatus(text) {
        var el = document.getElementById(OVERLAY_ID + '-status');
        if (el) el.textContent = text || '';
      }

      function startBarcodeDetectorLoop(video) {
        var detector = new BarcodeDetector({
          formats: [
            'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e',
            'qr_code', 'data_matrix', 'itf', 'codabar'
          ]
        });
        var busy = false;

        function tick() {
          if (!active) return;
          active.rafId = requestAnimationFrame(tick);
          if (busy || video.readyState < 2) return;
          busy = true;
          detector.detect(video).then(function (codes) {
            busy = false;
            if (!active || !codes || !codes.length) return;
            var value = (codes[0].rawValue || '').trim();
            if (value) closeInternal(value);
          }).catch(function () {
            busy = false;
          });
        }

        setStatus('');
        tick();
      }

      function startZxing(video, stream) {
        return loadZxing().then(function (ZXing) {
          if (!ZXing || !ZXing.BrowserMultiFormatReader) {
            throw new Error('مكتبة قراءة الباركود غير متاحة');
          }
          var reader = new ZXing.BrowserMultiFormatReader();
          active.codeReader = reader;
          setStatus('');
          var onResult = function (result, err) {
            if (!active || err || !result) return;
            var value = String(result.getText ? result.getText() : result.text || '').trim();
            if (value) closeInternal(value);
          };
          if (typeof reader.decodeFromStream === 'function') {
            return reader.decodeFromStream(stream, video, onResult);
          }
          return reader.decodeFromVideoDevice(undefined, video, onResult);
        });
      }

      function openScanner(onDone) {
        if (typeof onDone !== 'function') {
          onDone = function () {};
        }
        if (active) {
          closeInternal('');
        }

        if (!window.isSecureContext) {
          onDone('');
          return Promise.resolve({
            ok: false,
            error: 'مسح الباركود يتطلب اتصال HTTPS آمن'
          });
        }

        var mediaDevices = navigator.mediaDevices;
        if (!mediaDevices || typeof mediaDevices.getUserMedia !== 'function') {
          onDone('');
          return Promise.resolve({
            ok: false,
            error: 'هذا المتصفح لا يدعم الكاميرا'
          });
        }

        var ui = buildOverlay();
        active = {
          stream: null,
          video: ui.video,
          onDone: onDone,
          rafId: 0,
          codeReader: null
        };

        var constraints = {
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        return mediaDevices.getUserMedia(constraints).then(function (stream) {
          if (!active) {
            stopStream(stream);
            return { ok: false, error: 'تم إلغاء المسح' };
          }
          active.stream = stream;
          ui.video.srcObject = stream;
          return ui.video.play().catch(function () {}).then(function () {
            if (!active) return { ok: false, error: 'تم إلغاء المسح' };
            if ('BarcodeDetector' in window) {
              startBarcodeDetectorLoop(ui.video);
              return { ok: true };
            }
            return startZxing(ui.video, stream).then(function () {
              return { ok: true };
            });
          });
        }).catch(function (err) {
          var message = 'تعذر تشغيل الكاميرا. تحقق من الصلاحيات ثم أعد المحاولة';
          var name = err && err.name ? String(err.name) : '';
          if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
            message = 'يرجى السماح بالوصول إلى الكاميرا من إعدادات المتصفح ثم إعادة المحاولة';
          } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
            message = 'مسح الباركود غير مدعوم على هذا الجهاز أو المتصفح';
          }
          setStatus(message);
          stopStream(active && active.stream);
          // Keep overlay so user can close after reading the error.
          return { ok: false, error: message };
        });
      }

      window.__pharmacyBarcodeScanner = {
        open: openScanner,
        close: function () { closeInternal(''); },
        isOpen: function () { return !!active; }
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async crossorigin="anonymous"></script>
</body>
</html>
